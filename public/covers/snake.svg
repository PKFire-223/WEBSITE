<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Marble Gradient -->
    <radialGradient id="marbleBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#14101e"/>
      <stop offset="50%" stop-color="#090610"/>
      <stop offset="100%" stop-color="#020105"/>
    </radialGradient>

    <!-- Rich Gold Gradients -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="25%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Ruby Gem Gradient -->
    <radialGradient id="rubyGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fecdd3"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="85%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </radialGradient>

    <!-- Emerald Gem Gradient -->
    <radialGradient id="emeraldGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Snake Skin Scales Pattern -->
    <pattern id="snakeScales" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0,8 C 4,4 12,4 16,8 C 12,12 4,12 0,8 Z" fill="#d97706" stroke="#fbbf24" stroke-width="0.8"/>
      <circle cx="8" cy="8" r="2.5" fill="#10b981"/>
    </pattern>

    <!-- Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="appleRadiance" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#marbleBg)"/>

  <!-- Subtle Marble Veining in Background -->
  <path d="M -50,150 Q 200,280 450,180 T 850,300" fill="none" stroke="#2a1f44" stroke-width="2" opacity="0.3"/>
  <path d="M -50,600 Q 300,500 500,680 T 850,550" fill="none" stroke="#2a1f44" stroke-width="2.5" opacity="0.25"/>

  <!-- Outer Grand Ornate Plaque Frame (Tấm Phù Điêu Hoàng Gia) -->
  <g transform="translate(400, 390)" filter="url(#boxShadow)">
    
    <!-- Plaque Outer Gold Rim -->
    <rect x="-350" y="-230" width="700" height="460" rx="24" fill="#120c1d" stroke="url(#goldPlate)" stroke-width="7"/>
    <rect x="-340" y="-220" width="680" height="440" rx="18" fill="#08040d" stroke="url(#goldPlate)" stroke-width="2"/>

    <!-- Auspicious Golden Clouds on Top Left & Bottom Corners -->
    <g fill="none" stroke="url(#goldHighlight)" stroke-width="2" opacity="0.85">
      <!-- Top Left Cloud -->
      <path d="M -320,-170 C -300,-195 -260,-195 -250,-170 C -240,-150 -255,-135 -275,-135 C -295,-135 -320,-150 -320,-170 Z"/>
      <path d="M -260,-160 C -240,-180 -210,-175 -205,-155 C -200,-140 -215,-130 -235,-130"/>
      <!-- Top Right Cloud -->
      <path d="M 280,-170 C 300,-195 330,-190 335,-170 C 340,-150 325,-135 305,-135"/>
      <!-- Bottom Left Phoenix Emblem -->
      <path d="M -310,180 C -280,150 -250,160 -240,190 M -290,190 C -270,170 -250,200 -230,195"/>
      <!-- Bottom Right Phoenix Crest -->
      <path d="M 310,180 C 280,150 250,160 240,190 M 290,190 C 270,170 250,200 230,195"/>
    </g>

    <!-- Golden Labyrinth Maze Channels (Đường Rãnh Mê Cung) -->
    <g stroke="url(#goldPlate)" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
      <!-- Vertical Maze Corridors -->
      <path d="M -160,110 L -160,-100 L -100,-100 L -100,110"/>
      <path d="M -40,110 L -40,-120 L 20,-120 L 20,110"/>
      <path d="M 80,110 L 80,-100 L 140,-100 L 140,110"/>
      <!-- Outer Enclosing Loop -->
      <rect x="-220" y="-140" width="440" height="280" rx="14" stroke-width="6"/>
    </g>

    <!-- INNER LABYRINTH SHADOW CHANNELS -->
    <g stroke="#030206" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -160,110 L -160,-100 L -100,-100 L -100,110"/>
      <path d="M -40,110 L -40,-120 L 20,-120 L 20,110"/>
      <path d="M 80,110 L 80,-100 L 140,-100 L 140,110"/>
    </g>

    <!-- ======================================================== -->
    <!-- THE SACRED RUBY GEMSTONE APPLE (QUẢ TÁO HỒNG NGỌC) -->
    <!-- ======================================================== -->
    <g transform="translate(190, 10)" filter="url(#appleRadiance)">
      <!-- Pulsing Aura Behind Apple -->
      <circle cx="0" cy="0" r="48" fill="#e11d48" opacity="0.25"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="url(#goldHighlight)" stroke-width="2.5" stroke-dasharray="6 4"/>

      <!-- Apple Body Shape -->
      <path d="M 0,-24 C 14,-34 32,-20 32,5 C 32,26 15,35 0,33 C -15,35 -32,26 -32,5 C -32,-20 -14,-34 0,-24 Z" 
            fill="url(#rubyGlow)" stroke="url(#goldPlate)" stroke-width="2.5"/>

      <!-- Golden Stem & Emerald Leaf -->
      <path d="M 0,-24 C 4,-38 12,-42 16,-44" fill="none" stroke="url(#goldHighlight)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 3,-32 C 14,-38 24,-34 26,-28 C 20,-24 10,-26 3,-32 Z" fill="url(#emeraldGrad)" stroke="url(#goldPlate)" stroke-width="1.5"/>

      <!-- Inlaid Cabochon Rubies on Apple -->
      <circle cx="-12" cy="-4" r="5" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1"/>
      <circle cx="12" cy="-4" r="5" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1"/>
      <circle cx="0" cy="14" r="6" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1"/>
      <circle cx="-10" cy="16" r="3.5" fill="#fda4af"/>
      <circle cx="10" cy="16" r="3.5" fill="#fda4af"/>

      <!-- Highlight Star Flares -->
      <path d="M -8,-16 L -4,-12 L -8,-8 L -12,-12 Z" fill="#ffffff"/>
      <circle cx="8" cy="-14" r="2" fill="#ffffff"/>
    </g>

    <!-- ======================================================== -->
    <!-- THE MYTHICAL GOLDEN & EMERALD SERPENT (HOÀNG KIM LINH XÀ) -->
    <!-- ======================================================== -->
    <!-- Serpent coiling through the labyrinth pathways -->
    <g filter="url(#glowGold)">
      <!-- Serpent Body Shadow Base -->
      <path d="M -260,95 C -240,40 -200,10 -150,15 C -90,20 -70,95 -20,95 C 30,95 50,-40 100,-40 C 140,-40 160,-20 180,-15" 
            fill="none" stroke="#000000" stroke-width="34" stroke-linecap="round" opacity="0.6"/>

      <!-- Serpent Primary Golden Armored Body -->
      <path id="serpentPath" d="M -260,95 C -240,40 -200,10 -150,15 C -90,20 -70,95 -20,95 C 30,95 50,-40 100,-40 C 140,-40 160,-20 180,-15" 
            fill="none" stroke="url(#goldPlate)" stroke-width="26" stroke-linecap="round"/>

      <!-- Serpent Emerald Center Inlay Spine -->
      <path d="M -255,90 C -238,42 -198,15 -150,20 C -92,25 -68,90 -20,90 C 28,90 48,-35 100,-35 C 135,-35 155,-18 175,-15" 
            fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round"/>

      <!-- Inlaid Ruby Cabochons Along the Spine -->
      <g fill="#e11d48" stroke="url(#goldHighlight)" stroke-width="1.5">
        <circle cx="-230" cy="50" r="4.5"/>
        <circle cx="-190" cy="18" r="4.5"/>
        <circle cx="-145" cy="22" r="5"/>
        <circle cx="-100" cy="55" r="5"/>
        <circle cx="-60" cy="85" r="5"/>
        <circle cx="-20" cy="90" r="5.5"/>
        <circle cx="20" cy="60" r="5"/>
        <circle cx="50" cy="10" r="5"/>
        <circle cx="80" cy="-30" r="5.5"/>
        <circle cx="120" cy="-35" r="5.5"/>
        <circle cx="155" cy="-22" r="5"/>
      </g>

      <!-- Serpent Tail Tapering into a Golden Coil -->
      <path d="M -260,95 C -275,120 -290,105 -285,85 C -280,65 -260,70 -265,90" 
            fill="none" stroke="url(#goldHighlight)" stroke-width="7" stroke-linecap="round"/>

      <!-- ======================================== -->
      <!-- SERPENT HEAD & JAWS (ĐẦU RẮN HOÀNG GIA) -->
      <!-- ======================================== -->
      <g transform="translate(180, -15)">
        <!-- Neck Flange -->
        <path d="M -15,-10 C -5,-16 10,-15 20,-8 C 15,10 -5,12 -15,5 Z" fill="url(#goldPlate)" stroke="#78350f" stroke-width="1.5"/>

        <!-- Head Crown & Upper Jaw -->
        <path d="M -8,-12 C 5,-20 25,-18 35,-6 C 42,0 42,8 36,12 C 25,18 5,16 -8,8 Z" 
              fill="url(#goldPlate)" stroke="url(#goldHighlight)" stroke-width="2"/>

        <!-- Emerald Scale Plates on Forehead -->
        <polygon points="5,-10 16,-12 18,-4 8,-2" fill="url(#emeraldGrad)"/>
        <polygon points="12,-4 25,-5 27,2 14,2" fill="url(#emeraldGrad)"/>

        <!-- Glowing Ruby Eye (Mắt Rồng/Mắt Rắn Hồng Ngọc) -->
        <ellipse cx="20" cy="-3" rx="4.5" ry="3.5" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1.5"/>
        <circle cx="21" cy="-4" r="1" fill="#ffffff"/> <!-- Eye Gleam -->

        <!-- Flickering Forked Tongue (Lưỡi Rắn Đỏ Thần Bí) -->
        <path d="M 38,5 L 50,7 L 58,2 M 50,7 L 58,11" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

        <!-- Golden Fangs -->
        <polygon points="34,7 38,12 32,10" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- Wooden Plinth Stand at Bottom -->
  <g transform="translate(400, 645)" filter="url(#boxShadow)">
    <rect x="-160" y="0" width="320" height="24" rx="4" fill="#451a03" stroke="#78350f" stroke-width="2"/>
    <rect x="-190" y="22" width="380" height="20" rx="4" fill="#2d1205" stroke="#78350f" stroke-width="2"/>
  </g>

  <!-- Game Title Badge Plate -->
  <g transform="translate(400, 725)">
    <rect x="-240" y="-35" width="480" height="66" rx="16" fill="#0c0714" fill-opacity="0.9" 
          stroke="url(#goldPlate)" stroke-width="2" filter="url(#boxShadow)"/>
    
    <text x="0" y="-3" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Palatino', serif" 
          font-size="28" font-weight="900" fill="url(#goldHighlight)" letter-spacing="4" filter="url(#glowGold)">
      RẮN SĂN MỒI
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" 
          font-size="12" font-weight="700" fill="#34d399" letter-spacing="2">
      MÊ CUNG HOÀNG KIM • CHIẾN THUẬT CỔ ĐIỂN
    </text>

    <!-- Ruby Gem Accents -->
    <circle cx="-220" cy="-2" r="5" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1.5"/>
    <circle cx="220" cy="-2" r="5" fill="#f43f5e" stroke="url(#goldHighlight)" stroke-width="1.5"/>
  </g>

  <!-- Outer Cover Border -->
  <rect x="18" y="18" width="764" height="764" rx="28" fill="none" stroke="url(#goldPlate)" stroke-width="3"/>
  <rect x="26" y="26" width="748" height="748" rx="22" fill="none" stroke="#eab308" stroke-width="1" opacity="0.35"/>
  
  <!-- Corner Runes -->
  <g fill="url(#goldHighlight)">
    <circle cx="48" cy="48" r="5"/>
    <circle cx="752" cy="48" r="5"/>
    <circle cx="48" cy="752" r="5"/>
    <circle cx="752" cy="752" r="5"/>
  </g>
</svg>
