<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Observatory Library Gradient -->
    <radialGradient id="libraryBg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#241442"/>
      <stop offset="35%" stop-color="#140a28"/>
      <stop offset="70%" stop-color="#090314"/>
      <stop offset="100%" stop-color="#030107"/>
    </radialGradient>

    <!-- Starlight Window Dome -->
    <radialGradient id="domeSky" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090314"/>
    </radialGradient>

    <!-- Stone Board Gradients -->
    <linearGradient id="stoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="stoneTile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0f0b18"/>
    </linearGradient>

    <!-- Gem Gradients -->
    <!-- Blue Sapphire -->
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Purple Amethyst -->
    <linearGradient id="amethystGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>

    <!-- Emerald Gem -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="80%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- Golden Crown Topaz -->
    <linearGradient id="topazGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Ruby Gem -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Wand Gold & Glow -->
    <linearGradient id="wandGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="magicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigSparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" fill="url(#libraryBg)"/>

  <!-- Celestial Arched Dome Window with Moon & Stars -->
  <g opacity="0.6">
    <path d="M 200,0 C 200,160 300,200 400,200 C 500,200 600,160 600,0 Z" fill="url(#domeSky)"/>
    <!-- Crescent Moon -->
    <path d="M 270,60 A 24,24 0 1,0 290,95 A 18,18 0 1,1 270,60 Z" fill="#fef08a" opacity="0.85"/>
    <!-- Dome Iron Ribs -->
    <path d="M 400,0 L 400,200 M 300,0 C 320,80 350,150 400,200 M 500,0 C 480,80 450,150 400,200" 
          stroke="#475569" stroke-width="2" fill="none"/>
  </g>

  <!-- Wizard Bookshelves Silhouettes & Glowing Potions on Flanks -->
  <!-- Left Bookshelf -->
  <g opacity="0.7">
    <rect x="0" y="80" width="160" height="580" fill="#0f091f" stroke="#33214b" stroke-width="2"/>
    <line x1="0" y1="220" x2="160" y2="220" stroke="#4a356b" stroke-width="6"/>
    <line x1="0" y1="360" x2="160" y2="360" stroke="#4a356b" stroke-width="6"/>
    <line x1="0" y1="500" x2="160" y2="500" stroke="#4a356b" stroke-width="6"/>
    <!-- Book Spines -->
    <rect x="15" y="240" width="22" height="115" rx="3" fill="#881337"/>
    <rect x="42" y="255" width="18" height="100" rx="3" fill="#1e3a8a"/>
    <rect x="65" y="235" width="25" height="120" rx="3" fill="#065f46"/>
    <rect x="95" y="250" width="20" height="105" rx="3" fill="#78350f"/>
    <!-- Glowing Potion on Shelf -->
    <path d="M 35,465 C 25,480 25,495 35,495 C 45,495 45,480 35,465 Z" fill="#ec4899" filter="url(#magicGlow)"/>
  </g>

  <!-- Right Bookshelf & Golden Astrolabe Sphere -->
  <g opacity="0.7">
    <rect x="640" y="80" width="160" height="580" fill="#0f091f" stroke="#33214b" stroke-width="2"/>
    <line x1="640" y1="220" x2="800" y2="220" stroke="#4a356b" stroke-width="6"/>
    <line x1="640" y1="360" x2="800" y2="360" stroke="#4a356b" stroke-width="6"/>
    <line x1="640" y1="500" x2="800" y2="500" stroke="#4a356b" stroke-width="6"/>
    <!-- Golden Astrolabe -->
    <circle cx="720" cy="290" r="45" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="720" cy="290" rx="45" ry="18" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="720" y1="240" x2="720" y2="340" stroke="#d97706" stroke-width="2"/>
  </g>

  <!-- ======================================================== -->
  <!-- MAIN 8x8 RUNIC STONE BOARD IN CENTER -->
  <!-- ======================================================== -->
  <g transform="translate(400, 380)">
    <!-- Outer Runic Stone Frame -->
    <rect x="-180" y="-190" width="360" height="380" rx="16" fill="#1e172e" stroke="url(#stoneBorder)" stroke-width="10"/>
    <rect x="-170" y="-180" width="340" height="360" rx="12" fill="#0b0814" stroke="#475569" stroke-width="2"/>

    <!-- Carved Runes Around Stone Frame -->
    <g fill="#94a3b8" font-family="monospace" font-size="11" opacity="0.75">
      <!-- Top Runes -->
      <text x="-140" y="-178">ᚠ</text>
      <text x="-100" y="-178">ᚢ</text>
      <text x="-60" y="-178">ᚦ</text>
      <text x="-20" y="-178">ᚨ</text>
      <text x="20" y="-178">ᚱ</text>
      <text x="60" y="-178">ᚲ</text>
      <text x="100" y="-178">ᚷ</text>
      <text x="140" y="-178">ᚹ</text>
      <!-- Left Runes -->
      <text x="-174" y="-140">ᚺ</text>
      <text x="-174" y="-100">ᚾ</text>
      <text x="-174" y="-60">ᛁ</text>
      <text x="-174" y="-20">ᛃ</text>
      <text x="-174" y="20">ᛈ</text>
      <text x="-174" y="60">ᛇ</text>
      <text x="-174" y="100">ᛉ</text>
      <text x="-174" y="140">ᛋ</text>
    </g>

    <!-- Grid Cells (8x8 Grid Texture) -->
    <g stroke="#261b3b" stroke-width="1.5">
      <!-- Background tiles -->
      <rect x="-152" y="-160" width="304" height="320" fill="#0c0817"/>
      <!-- Grid lines -->
      <line x1="-114" y1="-160" x2="-114" y2="160"/>
      <line x1="-76" y1="-160" x2="-76" y2="160"/>
      <line x1="-38" y1="-160" x2="-38" y2="160"/>
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="38" y1="-160" x2="38" y2="160"/>
      <line x1="76" y1="-160" x2="76" y2="160"/>
      <line x1="114" y1="-160" x2="114" y2="160"/>

      <line x1="-152" y1="-120" x2="152" y2="-120"/>
      <line x1="-152" y1="-80" x2="152" y2="-80"/>
      <line x1="-152" y1="-40" x2="152" y2="-40"/>
      <line x1="-152" y1="0" x2="152" y2="0"/>
      <line x1="-152" y1="40" x2="152" y2="40"/>
      <line x1="-152" y1="80" x2="152" y2="80"/>
      <line x1="-152" y1="120" x2="152" y2="120"/>
    </g>

    <!-- PLACED GEM BLOCKS ON BOARD -->
    <!-- Column 1: Blue Sapphires (Full Combo Stack) -->
    <g filter="url(#magicGlow)">
      <rect x="-150" y="-158" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <polygon points="-133,-154 -122,-140 -133,-126 -144,-140" fill="#ffffff" opacity="0.6"/>

      <rect x="-150" y="-118" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <polygon points="-133,-114 -122,-100 -133,-86 -144,-100" fill="#ffffff" opacity="0.6"/>

      <rect x="-150" y="-78" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="-150" y="-38" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="-150" y="2" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="-150" y="42" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="-150" y="82" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="-150" y="122" width="34" height="36" rx="6" fill="url(#sapphireGrad)" stroke="#e0f2fe" stroke-width="1.5"/>
    </g>

    <!-- Other Gem Blocks on Board -->
    <!-- Emerald Green Blocks -->
    <rect x="-74" y="42" width="34" height="36" rx="6" fill="url(#emeraldGrad)" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="-74" y="82" width="34" height="36" rx="6" fill="url(#emeraldGrad)" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="-36" y="82" width="34" height="36" rx="6" fill="url(#emeraldGrad)" stroke="#bbf7d0" stroke-width="1.5"/>
    <rect x="40" y="122" width="34" height="36" rx="6" fill="url(#emeraldGrad)" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Purple Amethyst Blocks -->
    <rect x="-112" y="82" width="34" height="36" rx="6" fill="url(#amethystGrad)" stroke="#f5d0fe" stroke-width="1.5"/>
    <rect x="78" y="122" width="34" height="36" rx="6" fill="url(#amethystGrad)" stroke="#f5d0fe" stroke-width="1.5"/>
    <rect x="116" y="82" width="34" height="36" rx="6" fill="url(#amethystGrad)" stroke="#f5d0fe" stroke-width="1.5"/>

    <!-- Golden Topaz & Crowns -->
    <rect x="-74" y="-78" width="34" height="36" rx="6" fill="url(#topazGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="-74" y="-38" width="34" height="36" rx="6" fill="url(#topazGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="-36" y="-78" width="34" height="36" rx="6" fill="url(#topazGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="2" y="122" width="34" height="36" rx="6" fill="url(#topazGrad)" stroke="#fef08a" stroke-width="1.5"/>

    <!-- Ruby Gem Blocks -->
    <rect x="-112" y="122" width="34" height="36" rx="6" fill="url(#rubyGrad)" stroke="#fecdd3" stroke-width="1.5"/>
    <rect x="-74" y="122" width="34" height="36" rx="6" fill="url(#rubyGrad)" stroke="#fecdd3" stroke-width="1.5"/>

    <!-- EXPLODING COMBO EFFECT (CLEARING 2x2 BOTTOM RIGHT) -->
    <g transform="translate(100, 100)" filter="url(#bigSparkle)">
      <rect x="-24" y="-24" width="70" height="70" rx="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <!-- Glowing Starburst -->
      <circle cx="11" cy="11" r="28" fill="#38bdf8" opacity="0.35"/>
      <path d="M 11,-15 L 14,8 L 37,11 L 14,14 L 11,37 L 8,14 L -15,11 L 8,8 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- FALLING MAGIC GEMS STREAM FROM HEAVENS -->
  <!-- ======================================================== -->
  <g transform="translate(380, 110)" filter="url(#magicGlow)">
    <path d="M 30,-50 Q 5,10 -10,70" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4"/>
    <!-- Falling Topaz -->
    <rect x="-5" y="-30" width="30" height="30" rx="6" transform="rotate(18)" fill="url(#topazGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Falling Sapphire Crystal -->
    <polygon points="5,20 18,32 5,55 -8,40" fill="url(#sapphireGrad)" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Falling Emerald -->
    <rect x="15" y="70" width="28" height="28" rx="6" transform="rotate(-12)" fill="url(#emeraldGrad)" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>

  <!-- ======================================================== -->
  <!-- MAGIC WAND & SPELL CIRCLE PLACING TILE (GẬY PHÉP ĐẶT KHỐI) -->
  <!-- ======================================================== -->
  <g transform="translate(560, 370)" filter="url(#magicGlow)">
    <!-- Glowing Arcane Circle Aura -->
    <circle cx="-30" cy="-30" r="55" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="-30" cy="-30" r="42" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Magic Tile Being Held & Moved -->
    <rect x="-50" y="-50" width="40" height="40" rx="8" fill="url(#sapphireGrad)" stroke="#ffffff" stroke-width="2.5"/>
    <polygon points="-30,-45 -18,-30 -30,-15 -42,-30" fill="#ffffff" opacity="0.8"/>

    <!-- Elegant Magic Wand -->
    <g transform="rotate(-35, -30, -30)">
      <!-- Wand Shaft -->
      <line x1="0" y1="0" x2="160" y2="160" stroke="url(#wandGold)" stroke-width="5" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="160" y2="160" stroke="#78350f" stroke-width="1"/>
      <!-- Wand Golden Filigree Crown -->
      <path d="M -8,-8 C 5,-22 22,-5 8,8 Z" fill="url(#wandGold)"/>
      <!-- Glowing Crystal Tip -->
      <circle cx="-2" cy="-2" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="-2" cy="-2" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ADORABLE PURPLE WIZARD OWL MASCOT (CÚ CON PHÁP SƯ) -->
  <!-- ======================================================== -->
  <g transform="translate(135, 420)" filter="url(#magicGlow)">
    <!-- Spellbook Stand Beneath Owl -->
    <path d="M -55,60 L 55,60 L 65,80 L -65,80 Z" fill="#881337" stroke="#fbbf24" stroke-width="2"/>
    <rect x="-65" y="80" width="130" height="15" rx="3" fill="#fef08a"/>

    <!-- Owl Fluffy Body -->
    <ellipse cx="0" cy="20" rx="36" ry="38" fill="#818cf8"/>
    <!-- Light Belly Feathers -->
    <ellipse cx="0" cy="28" rx="24" ry="25" fill="#e0e7ff"/>
    <path d="M -12,20 C -8,25 -4,25 0,20 C 4,25 8,25 12,20" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M -12,32 C -8,37 -4,37 0,32 C 4,37 8,37 12,32" fill="none" stroke="#6366f1" stroke-width="1.5"/>

    <!-- Left Wing Raised Greeting/Casting -->
    <path d="M 30,10 C 48,0 55,20 40,35 C 32,32 30,20 30,10 Z" fill="#6366f1"/>
    <!-- Right Wing Tucked -->
    <path d="M -30,15 C -45,22 -40,38 -28,38 Z" fill="#6366f1"/>

    <!-- Big Expressive Starry Eyes -->
    <circle cx="-14" cy="5" r="14" fill="#ffffff"/>
    <circle cx="14" cy="5" r="14" fill="#ffffff"/>
    
    <!-- Irises (Deep Blue/Teal) -->
    <circle cx="-12" cy="6" r="9" fill="#0284c7"/>
    <circle cx="16" cy="6" r="9" fill="#0284c7"/>
    <circle cx="-12" cy="6" r="5" fill="#082f49"/>
    <circle cx="16" cy="6" r="5" fill="#082f49"/>
    
    <!-- Starlight Catchlights -->
    <circle cx="-15" cy="3" r="3.5" fill="#ffffff"/>
    <circle cx="13" cy="3" r="3.5" fill="#ffffff"/>
    <circle cx="-9" cy="8" r="1.5" fill="#ffffff"/>
    <circle cx="19" cy="8" r="1.5" fill="#ffffff"/>

    <!-- Cute Beak -->
    <polygon points="0,11 6,18 -6,18" fill="#f59e0b"/>

    <!-- Crooked Wizard Witch Hat with Stars -->
    <g transform="translate(0, -10)">
      <!-- Hat Brim -->
      <ellipse cx="0" cy="-6" rx="42" ry="12" fill="#4338ca" stroke="#312e81" stroke-width="2"/>
      <ellipse cx="0" cy="-6" rx="26" ry="7" fill="#fbbf24"/>
      <!-- Hat Cone -->
      <path d="M -24,-8 C -15,-40 5,-55 28,-60 C 22,-50 12,-35 22,-8 Z" fill="#4f46e5" stroke="#312e81" stroke-width="2"/>
      <!-- Gold Star on Hat -->
      <polygon points="8,-38 11,-30 19,-30 13,-24 15,-16 8,-20 1,-16 3,-24 -3,-30 5,-30" fill="#fde047"/>
    </g>
  </g>

  <!-- Game Title Badge Plate -->
  <g transform="translate(400, 725)">
    <rect x="-240" y="-35" width="480" height="66" rx="16" fill="#0b0617" fill-opacity="0.9" 
          stroke="url(#wandGold)" stroke-width="2" filter="url(#magicGlow)"/>
    
    <text x="0" y="-3" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Palatino', serif" 
          font-size="28" font-weight="900" fill="#fef08a" letter-spacing="4" filter="url(#magicGlow)">
      XẾP KHỐI MA THUẬT
    </text>
    <text x="0" y="20" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" 
          font-size="12" font-weight="700" fill="#c084fc" letter-spacing="2">
      RUNIC PUZZLE • HUYỀN BÍ 8x8 NỔ DÒNG
    </text>

    <!-- Gem Diamond Accents -->
    <polygon points="-220,-2 -228,-10 -236,-2 -228,6" fill="#38bdf8"/>
    <polygon points="220,-2 228,-10 236,-2 228,6" fill="#38bdf8"/>
  </g>

  <!-- Outer Cover Border -->
  <rect x="18" y="18" width="764" height="764" rx="28" fill="none" stroke="url(#wandGold)" stroke-width="3"/>
  <rect x="26" y="26" width="748" height="748" rx="22" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
</svg>
