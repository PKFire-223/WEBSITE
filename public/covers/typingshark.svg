<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="30%" stop-color="#0369a1"/>
      <stop offset="70%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Headlight Beam -->
    <radialGradient id="lightBeam" cx="15%" cy="70%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#082f49" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Text Gradient -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Ocean Background -->
  <rect width="600" height="800" fill="url(#oceanBg)"/>

  <!-- Light Caustics -->
  <path d="M 50 0 L 220 800 L 150 800 L 0 0 Z" fill="#38bdf8" opacity="0.08"/>
  <path d="M 200 0 L 380 800 L 300 800 L 120 0 Z" fill="#38bdf8" opacity="0.06"/>
  <path d="M 400 0 L 580 800 L 520 800 L 320 0 Z" fill="#38bdf8" opacity="0.07"/>

  <!-- Bubbles -->
  <circle cx="80" cy="550" r="14" fill="#bae6fd" opacity="0.25" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="140" cy="400" r="8" fill="#bae6fd" opacity="0.3"/>
  <circle cx="480" cy="620" r="18" fill="#bae6fd" opacity="0.2" stroke="#ffffff" stroke-width="2"/>
  <circle cx="510" cy="350" r="10" fill="#bae6fd" opacity="0.25"/>
  <circle cx="320" cy="480" r="6" fill="#bae6fd" opacity="0.3"/>

  <!-- Submarine Headlight Beam -->
  <path d="M 90 560 L 580 400 L 580 720 Z" fill="url(#lightBeam)"/>

  <!-- Giant Menacing Shark Silhouette & Detail -->
  <g transform="translate(320, 410)">
    <!-- Dorsal Fin -->
    <path d="M -40 -30 L 10 -110 L 60 -30 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <!-- Main Shark Body -->
    <ellipse cx="0" cy="0" rx="190" ry="75" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Tail Fin -->
    <path d="M 170 0 L 260 -70 L 230 0 L 270 70 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Sharp Teeth in Jaws -->
    <polygon points="-160, -10 -140, 0 -130, -8 -110, 0 -100, -8 -80, 0 -90, 15 -140, 20" fill="#f8fafc"/>
    <!-- Glowing Menacing Eye -->
    <circle cx="-110" cy="-24" r="10" fill="#ef4444" filter="url(#cyanGlow)"/>
    <circle cx="-110" cy="-24" r="4" fill="#ffffff"/>
    
    <!-- Floating Word Plate above Shark: "MEGALODON" -->
    <rect x="-110" y="-140" width="220" height="42" rx="10" fill="#020617" stroke="#22d3ee" stroke-width="3" filter="url(#cyanGlow)"/>
    <text x="0" y="-112" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="900" text-anchor="middle" fill="#34d399">
      MEGA<tspan fill="#fef08a">LODON</tspan>
    </text>
  </g>

  <!-- Player High-Tech Submarine -->
  <g transform="translate(100, 570)">
    <!-- Shield Aura -->
    <ellipse cx="0" cy="0" rx="65" ry="42" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.8" filter="url(#cyanGlow)"/>
    <!-- Sub Hull -->
    <ellipse cx="0" cy="0" rx="50" ry="26" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <!-- Tower & Periscope -->
    <rect x="-14" y="-36" width="24" height="16" fill="#d97706" rx="3"/>
    <rect x="-5" y="-46" width="8" height="12" fill="#78716c"/>
    <!-- Glowing Window -->
    <circle cx="22" cy="-4" r="10" fill="#38bdf8" stroke="#ffffff" stroke-width="2" filter="url(#cyanGlow)"/>
    <!-- Auto-Typing Drone Hovering -->
    <g transform="translate(0, -75)">
      <circle cx="0" cy="0" r="14" fill="#0891b2" stroke="#22d3ee" stroke-width="2.5" filter="url(#cyanGlow)"/>
      <circle cx="4" cy="0" r="5" fill="#a5f3fc"/>
      <!-- Laser Zap Beam pointing to Shark -->
      <line x1="14" y1="0" x2="160" y2="-60" stroke="#22d3ee" stroke-width="3.5" stroke-dasharray="8 4" filter="url(#cyanGlow)"/>
    </g>
  </g>

  <!-- Seafloor Coral & Rocks -->
  <path d="M 0 800 L 0 740 Q 150 710 300 750 T 600 730 L 600 800 Z" fill="#020617"/>

  <!-- Title Badge & Typography -->
  <g transform="translate(300, 110)">
    <!-- Subtitle Badge -->
    <rect x="-140" y="-30" width="280" height="28" rx="14" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#38bdf8" letter-spacing="3">
      ROGUELIKE TYPING ADVENTURE
    </text>

    <!-- Main Title -->
    <text x="0" y="45" font-family="'Impact', sans-serif" font-size="54" font-weight="900" text-anchor="middle" fill="url(#goldText)" letter-spacing="2">
      TYPING SHARK
    </text>
    <text x="0" y="85" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" text-anchor="middle" fill="#bae6fd" letter-spacing="4">
      VỰC SÂU THẦN HẢI
    </text>

    <!-- Feature tags -->
    <rect x="-180" y="110" width="360" height="34" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="0" y="132" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle" fill="#fef08a">
      ⚡ AI TỰ GÕ • CÂY KỸ NĂNG VÔ TẬN • 3 ĐẠI BOSS
    </text>
  </g>
</svg>
